name: gavel
description: "Gavel: AI-assisted mock trial preparation for student competitors."
publish_to: 'none'

version: 0.8.0+8

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Material and Cupertino ship as packages (not flutter/material.dart). Always
  # import package:material_ui/material_ui.dart so the app's Theme is the same
  # type go_router's pages read.
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  provider: ^6.1.5+1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
